<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史学习工作台</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-logo" aria-label="历史学习工作台">
      <div class="logo-icon">史</div>
      <span>历史学习工作台</span>
    </div>

    <label class="search-box">
      <span class="search-icon" aria-hidden="true">&#128269;</span>
      <input id="searchInput" type="search" placeholder="搜索事件、人物、地点、概念">
    </label>

    <div class="header-filters" aria-label="筛选">
      <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filterPanel">
        <span class="filter-toggle-icon" aria-hidden="true">&#9776;</span>
        <span>筛选</span>
        <span id="filterCount" class="filter-count" hidden>0</span>
      </button>
      <div id="activeFilters" class="active-filters" aria-live="polite"></div>
      <button id="clearFiltersBtn" class="clear-filters-btn" type="button" hidden>清除</button>
      <div id="filterPanel" class="filter-panel" hidden>
        <div class="filter-panel-head">
          <div>
            <h2>筛选事件</h2>
            <p id="filterResultCount"></p>
          </div>
          <button id="filterPanelClose" class="filter-panel-close" type="button" aria-label="关闭筛选">&#215;</button>
        </div>
        <div id="filterGroups" class="filter-groups"></div>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="timeline-panel" aria-label="时间线">
      <div class="panel-header">
        <h2>时间线</h2>
      </div>
      <div class="timeline-tabs" role="tablist" aria-label="主线导航类型">
        <button id="timeline-tab-events" class="timeline-tab active" role="tab" aria-selected="true" aria-controls="timelineList" type="button" data-mode="events">大事</button>
        <button id="timeline-tab-emperors" class="timeline-tab" role="tab" aria-selected="false" aria-controls="timelineList" type="button" data-mode="emperors">帝王</button>
      </div>
      <div id="timelineList" class="timeline-scroll"></div>
    </aside>

    <main class="event-detail" aria-live="polite">
      <div class="detail-topbar">
        <div>
          <h1 id="eventTitle"></h1>
          <div id="eventMeta" class="detail-meta"></div>
        </div>
        <div class="detail-actions">
          <button id="bookmarkBtn" class="detail-btn" type="button">&#9733; 收藏</button>
          <button id="focusReviewBtn" class="detail-btn" type="button">&#9998; 复习</button>
        </div>
      </div>

      <div class="detail-body">
        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9679;</span>
            <h2>关键人物</h2>
          </div>
          <div id="peopleChips" class="people-row"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9670;</span>
            <h2>背景</h2>
          </div>
          <div id="backgroundContent" class="detail-section-content"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9632;</span>
            <h2>疆域与人口</h2>
          </div>
          <div id="territoryPopulationContent" class="territory-population-list"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9633;</span>
            <h2>势力范围示意</h2>
          </div>
          <div id="politicalMapContent" class="political-map-list"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9654;</span>
            <h2>经过</h2>
          </div>
          <div id="processList" class="sub-event-list"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9656;</span>
            <h2>结果与影响</h2>
          </div>
          <div id="resultContent" class="detail-section-content"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9830;</span>
            <h2>不同说法</h2>
          </div>
          <div id="debateContent" class="detail-section-content"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span class="section-icon">&#9671;</span>
            <h2>关键判断</h2>
          </div>
          <div id="claimsList" class="claims-list"></div>
        </section>
      </div>
    </main>

    <aside class="supplementary-panel" aria-label="辅助信息">
      <div class="sup-tabs" role="tablist">
        <button id="sup-tab-people" class="sup-tab active" role="tab" aria-selected="true" aria-controls="tab-people" type="button" data-tab="people">人物</button>
        <button class="sup-tab" role="tab" aria-selected="false" type="button" data-tab="causal" aria-controls="tab-causal">因果链</button>
        <button class="sup-tab" role="tab" aria-selected="false" type="button" data-tab="sources" aria-controls="tab-sources">史料</button>
        <button class="sup-tab" role="tab" aria-selected="false" type="button" data-tab="citations" aria-controls="tab-citations">引用</button>
        <button class="sup-tab" role="tab" aria-selected="false" type="button" data-tab="review" aria-controls="tab-review">复习</button>
      </div>
      <div class="sup-content">
        <section id="tab-people" role="tabpanel" aria-labelledby="sup-tab-people" class="sup-section active"></section>
        <section id="tab-causal" role="tabpanel" aria-labelledby="sup-tab-causal" class="sup-section"></section>
        <section id="tab-sources" role="tabpanel" aria-labelledby="sup-tab-sources" class="sup-section"></section>
        <section id="tab-citations" role="tabpanel" aria-labelledby="sup-tab-citations" class="sup-section"></section>
        <section id="tab-review" role="tabpanel" aria-labelledby="sup-tab-review" class="sup-section"></section>
      </div>
    </aside>
  </div>

  <footer class="notes-bar">
    <button id="notesToggle" class="notes-toggle" type="button">&#9998; 笔记</button>
    <input aria-label="当前事件笔记" id="noteInput" class="notes-input" type="text" placeholder="记录理解、疑问、待查证">
    <span id="notesCount" class="notes-count"></span>
  </footer>

  <section id="notesOverlay" class="notes-overlay" role="dialog" aria-modal="true" aria-labelledby="notesTitle" hidden>
    <div class="notes-overlay-header">
      <h2 id="notesTitle"></h2>
      <button id="notesOverlayClose" class="notes-overlay-close" type="button" aria-label="关闭笔记">&#215;</button>
    </div>
    <div id="notesList" class="notes-list"></div>
  </section>
  <script defer src="data/bundle.js"></script>
  <script defer src="assets/app.js?v=20260710-source-status"></script>
</body>
</html>
